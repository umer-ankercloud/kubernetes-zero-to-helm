apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders
  namespace: day1
spec:
  ingressClassName: nginx
  rules:
    - host: day1.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 80
