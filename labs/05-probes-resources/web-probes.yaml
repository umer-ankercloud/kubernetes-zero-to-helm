apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-probes
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-probes}
  template:
    metadata:
      labels: {app: web-probes}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          startupProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web-probes
spec:
  selector: {app: web-probes}
  ports:
    - port: 80
      targetPort: 80
